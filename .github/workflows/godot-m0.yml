name: Godot CI

on:
  push:
    branches:
      - main
      - codex/**
      - foundation/**
      - docs/**
      - verification/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 stable
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse and import project
        run: ./godot --headless --path . --editor --quit

      - name: Run M0 and infinite-world regression tests
        run: timeout 60s ./godot --headless --audio-driver Dummy --path . --script res://tests/test_runner.gd

      - name: Validate content G0 gate
        run: |
          set -euo pipefail
          timeout 30s ./godot --headless --audio-driver Dummy --path . --script res://tools/validate_content.gd -- --profile=g0 --format=jsonl | tee content-g0.log
          grep -F '"gate_status":"pass"' content-g0.log

      - name: Confirm full catalog remains not ready
        shell: bash
        run: |
          set +e
          timeout 30s ./godot --headless --audio-driver Dummy --path . --script res://tools/validate_content.gd -- --profile=full --format=jsonl | tee content-full.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -F '"catalog_status":"not_ready"' content-full.log

      - name: Run infinite desert smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s ./godot --headless --audio-driver Dummy --path . --quit-after 600 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Failed loading resource" smoke.log; then
            exit 1
          fi
