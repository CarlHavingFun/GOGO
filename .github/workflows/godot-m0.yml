name: Godot M0

on:
  push:
    branches:
      - foundation/topdown-kit-evaluation
  pull_request:
    branches:
      - main
      - foundation/topdown-kit-evaluation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 stable
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse and import project
        run: ./godot --headless --path . --editor --quit

      - name: Run headless M0 tests
        run: ./godot --headless --path . res://tests/test_runner.tscn
