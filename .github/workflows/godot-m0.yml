name: Godot CI

on:
  push:
    branches:
      - foundation/topdown-kit-evaluation
      - docs/arena-spawn-design
  pull_request:
    branches:
      - main
      - foundation/topdown-kit-evaluation
      - docs/pixel-style-bible
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 stable
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse and import project
        run: ./godot --headless --path . --editor --quit

      - name: Run headless GOGO tests
        run: timeout 30s ./godot --headless --path . res://tests/test_runner.tscn

      - name: Run infinite desert smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s ./godot --headless --path . --quit-after 600 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Failed loading resource" smoke.log; then
            exit 1
          fi
